name: Sync community posts from Discord
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # adds the manual "Run workflow" button
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copy approved posts
        run: node scripts/sync-community-posts.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_FORUM_CHANNEL_ID: "1460246806247112890"
          APPROVAL_TAG_NAME: "Shared on website"
      - name: Save changes
        run: |
          git config user.name "bass-website-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/community-posts.json
          git diff --cached --quiet || (git commit -m "Update community posts from Discord" && git push)
